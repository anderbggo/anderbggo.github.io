<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/roko/roko_icon.svg?v=2" />
    <title>Roko</title>
    <meta
      name="description"
      content="Un rincón para recordar a Roko, labrador blanco. Enciende una vela o suelta un farolillo y déjale un mensaje."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anderbggo.github.io/roko/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roko" />
    <meta
      property="og:description"
      content="Enciende una vela o suelta un farolillo para Roko y déjale unas palabras."
    />
    <meta property="og:url" content="https://anderbggo.github.io/roko/" />
    <meta property="og:image" content="https://anderbggo.github.io/roko/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roko, labrador blanco, sonriendo sobre la hierba con el mar de fondo." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0a14" />
    <script>
      (() => {
        const language = localStorage.getItem("site-language") ?? localStorage.getItem("vestige-language") ?? localStorage.getItem("contribute-language");
        if (language === "es" || language === "en") document.documentElement.lang = language;
        const theme = localStorage.getItem("site-theme") ?? localStorage.getItem("vestige-theme");
        document.documentElement.dataset.siteTheme = theme === "light" || theme === "dark" ? theme : "system";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/roko/main.tsx"></script>
  </body>
</html>
