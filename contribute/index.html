<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vestige/vestige_icon.svg" />
    <title>Donaciones</title>
    <meta
      name="description"
      content="Apoya los proyectos de anderbggo mediante Buy Me a Coffee."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anderbggo.github.io/contribute/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Donaciones | anderbggo" />
    <meta
      property="og:description"
      content="Apoya los proyectos de anderbggo mediante Buy Me a Coffee."
    />
    <meta property="og:url" content="https://anderbggo.github.io/contribute/" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (() => {
        const language = localStorage.getItem("site-language") ?? localStorage.getItem("vestige-language") ?? localStorage.getItem("contribute-language");
        if (language === "es" || language === "en") document.documentElement.lang = language;
        const theme = localStorage.getItem("site-theme") ?? localStorage.getItem("vestige-theme");
        document.documentElement.dataset.siteTheme = theme === "light" || theme === "dark" ? theme : "system";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/contribute/main.tsx"></script>
  </body>
</html>
