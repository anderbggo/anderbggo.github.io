<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/gpmatcher/photo.ico" />
    <title>Google Photos Matcher v3.1 · Política de privacidad</title>
    <meta name="description" content="Política de privacidad de Google Photos Matcher v3.1: tratamiento local de fotos, vídeos y metadatos, restauración forzada y preferencias. Google Photos Matcher v3.1 privacy policy." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anderbggo.github.io/gpmatcher/privacy/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Google Photos Matcher" />
    <meta property="og:title" content="Google Photos Matcher v3.1 · Privacy / Privacidad" />
    <meta property="og:description" content="Cómo GPMatcher v3.1 trata tus archivos, metadatos y preferencias, incluida la restauración forzada. How GPMatcher v3.1 handles your files, metadata and preferences." />
    <meta property="og:url" content="https://anderbggo.github.io/gpmatcher/privacy/" />
    <meta property="og:image" content="https://anderbggo.github.io/gpmatcher/interface-v3.png?v=3.1" />
    <meta name="theme-color" content="#0E7A62" />
    <script>
      (() => {
        const language = localStorage.getItem("site-language") ?? localStorage.getItem("vestige-language") ?? localStorage.getItem("contribute-language");
        if (language === "es" || language === "en") document.documentElement.lang = language;
        const theme = localStorage.getItem("site-theme") ?? localStorage.getItem("vestige-theme");
        document.documentElement.dataset.siteTheme = theme === "light" || theme === "dark" ? theme : "system";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gpmatcher/main.tsx"></script>
  </body>
</html>
