<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vestige/vestige_icon.svg" />
    <title>Política de privacidad</title>
    <meta
      name="description"
      content="Política de privacidad de Vestige."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anderbggo.github.io/vestige/privacy/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vestige" />
    <meta property="og:title" content="Política de privacidad - Vestige" />
    <meta property="og:description" content="Cómo Vestige trata localmente tus vídeos, preferencias y permisos." />
    <meta property="og:url" content="https://anderbggo.github.io/vestige/privacy/" />
    <meta property="og:image" content="https://anderbggo.github.io/vestige/vestige_icon.svg" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        const language = localStorage.getItem("site-language") ?? localStorage.getItem("vestige-language") ?? localStorage.getItem("contribute-language");
        if (language === "es" || language === "en") document.documentElement.lang = language;
        const theme = localStorage.getItem("site-theme") ?? localStorage.getItem("vestige-theme");
        document.documentElement.dataset.siteTheme = theme === "light" || theme === "dark" ? theme : "system";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/vestige/main.tsx"></script>
  </body>
</html>
